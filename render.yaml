# Render Blueprint (New > Blueprint > pick this repository). One free web service.
# Render sets PORT and RENDER_EXTERNAL_HOSTNAME itself; the server then binds 0.0.0.0
# and allows that host name. Values marked sync: false are asked for when the Blueprint is created.
services:
  - type: web
    name: payonproof
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYEE_EMAIL_OVERRIDE
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_MAX_CALLS_PER_HOUR
        value: "120"
      - key: APPROVER_PASSCODE
        sync: false
